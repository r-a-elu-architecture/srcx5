# v1.5.1 FIX2 (tests/v15/FIX2_V15.md): replaces heartbeat.yml, kept unchanged in the private record.
# v1.5: the network signalling. Every six hours: pull admitted records from every listed node (write anywhere, converge
# everywhere), then republish the status document (mirrors, nodes, Bitcoin proof, IPFS content id) with the read API.
name: srcx5-heartbeat-v151
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency: {group: srcx5-log, cancel-in-progress: false}
jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python srcx5_node.py pull --log log && python srcx5.py check-log --log log
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          git config user.name srcx5-heartbeat; git config user.email srcx5-heartbeat@users.noreply.github.com
          if ! git diff --quiet log; then git add log && git commit -qm "heartbeat: records pulled from nodes" && git push -q && gh workflow run anchor_v141.yml || true; fi
          gh workflow run pages_v151.yml
