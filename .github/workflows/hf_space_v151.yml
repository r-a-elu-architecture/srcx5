# v1.5.1: keeps an always-on public node on a free Hugging Face Space (SDK Gradio, CPU basic) in step with this repository.
# Replaces hf_space.yml (Docker SDK is not free on this account; kept unchanged in the private record).
# The Space runs app.py, which starts the SRC-X.5 node on port 7860 (Gradio is installed by the Space but not used).
# One-time setup by the owner: create a Gradio Space (Blank), then set secret HF_TOKEN (write) and variable HF_SPACE (user/space).
name: srcx5-hf-space-v151
on:
  push:
    branches: [main]
    paths: [".github/workflows/hf_space_v151.yml", "deploy/space_app.py", "srcx5*.py", "log/**", "NODES.json", "MIRRORS.json", "openapi.json"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env: {HF_TOKEN: "${{ secrets.HF_TOKEN }}", HF_SPACE: "${{ vars.HF_SPACE }}"}
        run: |
          [ -n "$HF_TOKEN" ] && [ -n "$HF_SPACE" ] || { echo "HF_TOKEN or HF_SPACE not set; skipped"; exit 0; }
          mkdir /tmp/space && cp -r srcx5*.py SPEC_SRCX5_1_4_1.md openapi.json context.jsonld MIRRORS.json NODES.json llms.txt schema log /tmp/space/
          cp deploy/space_app.py /tmp/space/app.py
          printf -- '---\ntitle: SRC-X.5 node\nemoji: 🔗\ncolorFrom: green\ncolorTo: blue\nsdk: gradio\napp_file: app.py\npinned: true\nlicense: apache-2.0\nshort_description: "SRC-X.5 node - open record of sealed claims, MCP, A2A"\n---\n# SRC-X.5 node\nAn always-on node of the open record of sealed claims: read API, POST /submit, MCP over HTTP at /mcp, A2A at /a2a, agent card at /.well-known/agent-card.json.\nSource: https://github.com/%s\n' "$GITHUB_REPOSITORY" > /tmp/space/README.md
          cd /tmp/space && git init -q -b main && git add -A && git -c user.name=srcx5 -c user.email=srcx5@users.noreply.github.com commit -qm "sync from $GITHUB_SHA"
          git push -q --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
