# Publishes the viewer and the static read API (site/) to GitHub Pages on every change, and on each heartbeat.
# v1.5.4 FIX5 (tests/v15/FIX5_V15.md): the deploy of v1.5.1 (last good build, 11:44 UTC) without any IPFS step; the IPFS id
# is published by ipfs_v154.yml as site/api/ipfs.json. Replaces pages_v153.yml, kept in the private record.
# v1.5: srcx5_node export adds the A2A agent card, openapi_v15.json, NODES.json and status.json (mirrors, nodes,
# Bitcoin proof state); the IPFS content id of the read API is computed here and written into status.json.
name: srcx5-pages-v154
on:
  push:
    branches: [main]
    paths: ["log/**", "site/**", "anchors/**", ".github/workflows/pages_v154.yml", "SPEC_SRCX5_1_4_1.md", "srcx5_net.py", "srcx5_node.py", "openapi.json", "schema/**", "context.jsonld", "MIRRORS.json", "NODES.json", "llms.txt"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: {name: github-pages}
    steps:
      - uses: actions/checkout@v4
      - run: cp SPEC_SRCX5_1_4_1.md site/SPEC.md && cp llms.txt site/llms.txt && python srcx5.py check-log --log log
      - run: python srcx5_node.py export --log log --out site/api --anchors anchors --no-probe
      - run: python srcx5_node.py export --log log --out site/api --anchors anchors
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - uses: actions/deploy-pages@v4
