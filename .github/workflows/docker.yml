# v1.5: the node as a container on GitHub's registry: docker run -p 7860:7860 ghcr.io/r-a-elu-architecture/srcx5
name: srcx5-docker
on:
  push:
    branches: [main]
    paths: ["srcx5*.py", "deploy/**", "log/**", "NODES.json", "MIRRORS.json", "openapi.json"]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ github.token }}"}
      - id: t
        run: |
          IMG=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr 'A-Z' 'a-z')
          TAGS="$IMG:latest"; [ "${{ github.event_name }}" = release ] && TAGS="$TAGS,$IMG:${{ github.event.release.tag_name }}"
          echo "img=$IMG" >> $GITHUB_OUTPUT; echo "tags=$TAGS" >> $GITHUB_OUTPUT
      - uses: docker/build-push-action@v6
        with: {context: ., file: deploy/Dockerfile, push: true, tags: "${{ steps.t.outputs.tags }}"}
      - name: the image serves the record (health, MCP over HTTP, agent card)
        run: |
          docker run -d -p 7860:7860 --name n ${{ steps.t.outputs.img }}:latest; sleep 8
          curl -sf localhost:7860/health | tee /tmp/h.json; grep -q '"node": "1.5"' /tmp/h.json
          curl -sf -X POST localhost:7860/mcp -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q srcx5_verify
          curl -sf localhost:7860/.well-known/agent-card.json | grep -q '"name": "SRC-X.5"'
