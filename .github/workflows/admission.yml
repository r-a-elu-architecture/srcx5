# Immune layer 1 for the public log: every submission is checked by the same srcx5.check() that every node runs.
name: srcx5-admission
on:
  pull_request:
    paths: ["submissions/**"]
  push:
    branches: [main]
    paths: ["submissions/**"]
permissions:
  contents: write
jobs:
  admit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: check every submission against the current log (reasons printed for each rejection)
        run: |
          set -e; cp -r log /tmp/trial; ok=1
          for f in submissions/*.json; do [ -e "$f" ] || continue; python srcx5.py admit "$f" --log /tmp/trial || ok=0; done
          python srcx5.py check-log --log /tmp/trial; [ $ok = 1 ]
      - name: on main, append the admitted submissions and publish the read API
        if: github.event_name == 'push'
        run: |
          for f in submissions/*.json; do [ -e "$f" ] || continue; python srcx5.py admit "$f" --log log && git rm -q "$f"; done
          python srcx5.py check-log --log log && python srcx5_net.py export --log log --out site/api
          git config user.name srcx5-admission; git config user.email srcx5-admission@users.noreply.github.com
          git add log site/api && git commit -qm "admit submissions" && git push || echo "nothing to admit"
