# v1.5: pip install srcx5. Publishes on each release through PyPI trusted publishing (no token stored here).
# One-time setup by the owner on pypi.org: add a pending publisher (project srcx5, this repository, workflow pypi.yml, environment pypi).
name: srcx5-pypi
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions: {id-token: write, contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
